name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ruff
        run: pip install ruff==0.16.1  # keep in sync with .pre-commit-config.yaml

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Install test dependencies
        run: pip install pytest

      - name: Unit tests
        # Live tests that mutate a running simulator are opt-in via
        # ISAAC_MCP_LIVE_TESTS and stay skipped here; these are the contract
        # tests, and nothing should publish without them.
        run: pytest -q

  build-and-publish:
    needs: lint
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/isaacsim-mcp-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build tools
        run: pip install hatch

      - name: Build package
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
